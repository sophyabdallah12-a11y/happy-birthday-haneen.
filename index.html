<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Haneen 2026! ✨</title>
    <style>
        /* إعدادات الخطوط والتصميم العام */
        @import url('https://googleapis.com');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* 1. شاشة العداد التلقائي (Timeline) */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        #counter {
            font-size: 5rem;
            font-weight: 800;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            letter-spacing: 2px;
            animation: pulse 0.3s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }

        /* 2. شاشة الحفلة الرئيسية والخلفية الفخمة */
        #main-party {
            position: relative;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            padding: 20px;
        }

        /* تأثير الظل الفخم باستخدام الصورة المضببة والمعتمة كخلفية */
        #bg-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('https://imagesplugin.com');
            background-size: cover;
            background-position: center;
            filter: blur(25px);
            transform: scale(1.1); /* يمنع ظهور الحواف البيضاء الناتجة عن الـ blur */
            z-index: -2;
        }

        /* الحاوية المركزية للمحتوى لضمان التوافق مع الشاشات */
        .content-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        /* إطار الصورة الدائري المضيء بالتوهج الذهبي */
        .profile-frame {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #e1ad01; /* أصفر مستردة ذهبي */
            box-shadow: 0 0 35px rgba(225, 173, 1, 0.8), inset 0 0 20px rgba(225, 173, 1, 0.5);
            background: url('https://imagesplugin.com') center/cover no-repeat;
            margin-bottom: 25px;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 5. نصوص التهنئة باللغة الإنجليزية */
        .title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .title span {
            color: #e1ad01; /* اسم حنين بالذهبي المضيء */
            text-shadow: 0 0 15px rgba(225, 173, 1, 0.7);
        }

        .message {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
            color: #f0f0f0;
            margin-bottom: 40px;
            padding: 0 20px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* 3. تصميم الكعكة الاحترافية والمجسمة 3D باستخدام CSS */
        .cake-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin-top: 20px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* الشمعة واللهب المتحرك */
        .candle {
            position: absolute;
            bottom: 140px;
            width: 12px;
            height: 45px;
            background: linear-gradient(to right, #ffffff, #e1ad01, #ffffff);
            border-radius: 3px;
            z-index: 5;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 22px;
            background: radial-gradient(circle at bottom, #ffea00 20%, #ff5100 90%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.8);
            animation: flicker 0.15s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scaleX(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scaleX(1.1) rotate(3deg) scaleY(1.05); }
        }

        /* طبقات الكعكة */
        .cake-layer {
            border-radius: 12px 12px 4px 4px;
            position: relative;
            box-shadow: inset 0 4px 8px rgba(255,255,255,0.2), 0 10px 15px rgba(0,0,0,0.5);
        }

        /* الطبقة العلوية: أصفر مستردة مع كريمة شوكولاتة بيضاء سائلة ومسندلة */
        .layer-top {
            width: 140px;
            height: 65px;
            background-color: #e1ad01; /* أصفر مستردة كالحجاب */
            z-index: 3;
            bottom: -5px;
        }

        /* تأثير الكريمة السائلة Glossy Drips */
        .drips {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            display: flex;
            justify-content: space-around;
            z-index: 4;
        }

        .drip {
            width: 16px;
            height: 18px;
            background-color: #ffffff; /* كريمة شوكولاتة بيضاء ناصعة */
            border-radius: 0 0 10px 10px;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1);
        }
        .drip:nth-child(even) {
            height: 24px;
            width: 14px;
        }

        /* الطبقة السفلية: سوداء ملكية بنقوش بيضاء */
        .layer-bottom {
            width: 200px;
            height: 80px;
            background-color: #111111; /* أسود ملكي فخم */
            background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px; /* نقوش تشبه الفستان */
            z-index: 2;
        }

        /* قاعدة الكعكة المضيئة */
        .cake-stand {
            width: 230px;
            height: 12px;
            background: linear-gradient(to right, #888, #fff, #888);
            border-radius: 6px;
            z-index: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* 4. عناصر المؤثرات (البالونات وقصاصات الورق) */
        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            z-index: 8;
            opacity: 0.85;
            bottom: -100px;
            animation: flyUp 8s linear infinite;
        }

        .balloon:after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 22px;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
        }

        /* خيط البالونة */
        .balloon-string {
            position: absolute;
            bottom: -40px;
            left: 24px;
            width: 1px;
            height: 40px;
            background-color: rgba(255,255,255,0.4);
        }

        @keyframes flyUp {
            0% { transform: translateY(0) rotate(0deg); left: var(--start-left); }
            100% { transform: translateY(-120vh) rotate(var(--rot)); left: var(--end-left); }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            z-index: 7;
            top: -20px;
            opacity: 0.9;
            animation: rainDown 5s linear infinite;
        }

        @keyframes rainDown {
            0% { transform: translateY(0) rotate(0deg); left: var(--start-left); }
            100% { transform: translateY(110vh) rotate(360deg); left: var(--end-left); }
        }

        /* تلميح تفاعلي مخفي لتخطي قيود الصوت */
        #audio-tip {
            position: fixed;
            bottom: 15px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            z-index: 100;
            pointer-events: none;
        }

        /* تحسينات الشاشات الصغيرة (الموبايل) */
        @media (max-width: 480px) {
            #counter { font-size: 3.5rem; }
            .title { font-size: 2rem; }
            .message { font-size: 0.95rem; }
            .profile-frame { width: 150px; height: 150px; }
            .cake-wrapper { transform: scale(0.85); margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة العداد التلقائي المبدئية -->
    <div id="intro-screen">
        <div id="counter">2020</div>
    </div>

    <!-- 2. شاشة المفاجأة والحفلة الرئيسية -->
    <main id="main-party">
