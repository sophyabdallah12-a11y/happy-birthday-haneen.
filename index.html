<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Haneen 2026!</title>
    <style>
        /* إعدادات الخطوط والتصفير */
        @import url('https://googleapis.com');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* 1. شاشة العداد التلقائي المستقلة */
        #timeline-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }

        #year-counter {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 800;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
            letter-spacing: 5px;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }

        /* 2. شاشة المفاجأة الرئيسية واللف خلفية الظل الفخم */
        #main-party-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out;
        }

        /* الخلفية المضببة والمعتمة الشديدة باستخدام نفس الصورة */
        #luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://imagesplugin.com') center/cover no-repeat;
            filter: blur(20px);
            transform: scale(1.1);
            z-index: -2;
        }

        /* إطار الصورة المضيء والتوهج الذهبي */
        .profile-wrapper {
            margin-top: 40px;
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #d4af37, #fff, #b38f1d);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.6);
            z-index: 2;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #111;
        }

        /* 5. نصوص التهنئة الفاخرة */
        .greetings-box {
            text-align: center;
            max-width: 600px;
            margin: 25px auto;
            z-index: 2;
            padding: 0 15px;
        }

        .greetings-box h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .greetings-box h1 span {
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }

        .greetings-box p {
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            color: #f0f0f0;
            line-height: 1.6;
            font-weight: 300;
        }

        /* 3. تصميم الكعكة الاحترافية ثلاثية الأبعاد (3D CSS Cake) */
        .cake-container {
            position: relative;
            width: 200px;
            height: 220px;
            margin: 30px auto 50px auto;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* الطبقة السفلية (أسود بنقوش بيضاء) */
        .cake-layer-bottom {
            width: 200px;
            height: 80px;
            background: #111;
            border-radius: 20px 20px 10px 10px;
            position: relative;
            box-shadow: inset 0 5px 15px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.5);
            border-bottom: 4px solid #d4af37;
            overflow: hidden;
        }

        /* النقوش البيضاء على فستانها */
        .cake-layer-bottom::before {
            content: "❖ ❖ ❖ ❖ ❖ ❖ ❖ ❖";
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 5px;
        }

        /* الطبقة العلوية (أصفر مسطردة لامع) */
        .cake-layer-top {
            width: 150px;
            height: 70px;
            background: #e1ad01; /* مسطردة لامع */
            border-radius: 15px 15px 5px 5px;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 6px 10px rgba(255,255,255,0.3);
        }

        /* تأثير كريمة الشوكولاتة البيضاء السائلة المنسدلة (Glossy Drips) */
        .drips {
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 20px;
            display: flex;
            justify-content: space-around;
        }

        .drip {
            width: 12px;
            height: 18px;
            background: #fbfbfb;
            border-radius: 0 0 10px 10px;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.15);
        }
        .drip:nth-child(even) { height: 25px; width: 10px; }
        .drip:nth-child(3n) { height: 14px; }

        .cake-layer-top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: #fbfbfb;
            border-radius: 15px 15px 0 0;
        }

        /* الشمعة واللهب المتحرك */
        .candle {
            width: 10px;
            height: 45px;
            background: linear-gradient(to right, #fff, #d4af37, #fff);
            border-radius: 4px;
            position: relative;
            z-index: 3;
            margin-bottom: -2px;
        }

        .flame {
            width: 14px;
            height: 24px;
            background: radial-gradient(circle at bottom, #ffea00 20%, #ff6a00 60%, transparent 90%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -24px;
            left: -2px;
            animation: flicker 0.1s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px #ffea00);
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        /* 4. عناصر الحفلات (البالونات وقصاصات الورق) */
        .balloon {
            position: fixed;
            bottom: -100px;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            z-index: 1;
            opacity: 0.85;
            animation: floatUp 7s linear infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 22px;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-top: 8px solid currentColor;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); }
            50% { transform: translateY(-50vh) translateX(30px) rotate(10deg); }
            100% { transform: translateY(-110vh) translateX(-20px) rotate(-10deg); }
        }

        .confetti {
            position: fixed;
            top: -20px;
            width: 8px;
            height: 15px;
            z-index: 1;
            opacity: 0.8;
            animation: fall Down 5s linear infinite;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <!-- 1. شاشة العداد التلقائي المستقلة -->
    <div id="timeline-screen">
        <div id="year-counter">2020</div>
    </div>

    <!-- الخلفية الفخمة المظللة والمشوشة -->
    <div id="luxury-bg"></div>

    <!-- 2. شاشة المفاجأة وعناصر الحفلة الكاملة -->
    <div id="main-party-container">
        
        <!-- إطار الصورة المضيء لصاحبة العيد ميلاد -->
        <div class="profile-wrapper">
            <img class="profile-img" src="https://imagesplugin.com" alt="Haneen">
        </div>

        <!-- نصوص التهنئة باللغة الإنجليزية -->
        <div class="greetings-box">
            <h1>Happy Birthday, <span>Haneen</span>!</h1>
            <p>Wishing you a year filled with endless joy, beautiful moments, and true happiness in 2026! ✨</p>
        </div>

        <!-- الكعكة الاحترافية -->
        <div class="cake-container">
            <div class="candle"><div class="flame"></div></div>
            <div class="cake-layer-top">
                <div class="drips">
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                    <div class="drip"></div><div class="drip"></div><div class="drip"></div>
                </div>
            </div>
            <div class="cake-layer-bottom"></div>
        </div>

    </div>

    <!-- مشغل الصوت الخفي والمستمع الذكي للنقر والتفاعل للتشغيل التلقائي -->
